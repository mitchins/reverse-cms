<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Submit evidence · Reverse CRM</title></head>
  <body>
    <main>
      <h1>Submit a document</h1>
      <form action="/logout" method="post">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit">Log out</button>
      </form>
      <p>PDF, PNG, JPEG, or TIFF. Existing subjects only; nothing is created automatically.</p>
      <form action="/documents" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label>Document <input type="file" name="document_file" required></label>
        <button type="submit">Submit and process</button>
      </form>
    </main>
  </body>
</html>
